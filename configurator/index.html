<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Stealth Configurator</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --card: #0f3460;
    --card-hover: #1a4a7a;
    /*--card-selected: #e94560; */ /* magenta */
    --card-selected: #c1e9454d;  /* green */
    /*--card-selected: #e1894ab3; /* orange */
    --text: #eaeaea;
    --text-muted: #a0a0b0;
    /*--accent: #e94560; */ /* magenta */
    --accent: #c1e945a1;  /* green */
    /*--accent: #e99145f2; /* orange */
    --border: #2a2a4a;
    --file-bg: #0a0a1a;
    --file-text: #7ec8e3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
    display: flex;
    gap: 1.5rem;
    align-items: flex-start;
  }
  #sections { flex: 1; }
  h1 { text-align: center; font-size: 1.6rem; margin-bottom: .5rem; }
  #header { text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: .95rem; }

  .section {
    margin-bottom: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem 1.4rem;
  }
  .section h2 {
    font-size: 1rem;
    margin-bottom: .7rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .options { display: flex; flex-wrap: wrap; gap: .5rem; }
  .opt {
    padding: .55em 1em;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: .88rem;
    transition: background .15s, border-color .15s, transform .1s;
    user-select: none;
  }
  .opt:hover { background: var(--card-hover); transform: translateY(-1px); }
  .opt.selected { background: var(--card-selected); border-color: var(--card-selected); color: #fff; }
  .opt.disabled { opacity: .35; pointer-events: none; }
  .hidden { display: none !important; }

  .sub-label { font-size: .78rem; color: var(--text-muted); margin: .5rem 0 .3rem; }

  /* Preview panel */
  #preview-panel {
    position: sticky;
    top: 1rem;
    width: 220px;
    min-height: 260px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .8rem;
    text-align: center;
    flex-shrink: 0;
  }
  #preview-img {
    width: 100%;
    max-height: 200px;
    object-fit: contain;
    border-radius: 4px;
  }
  #preview-label { margin-top: .5rem; font-size: .8rem; color: var(--text-muted); }

  /* File list output */
  #filelist {
    margin-top: 2rem;
    padding: 1.2rem 1.4rem;
    background: var(--file-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: .84rem;
    color: var(--file-text);
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.6;
  }
  #filelist h3 { color: var(--text); margin-bottom: .6rem; font-family: inherit; font-size: .95rem; }
  #filelist .cat { color: #f0c040; font-weight: bold; }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    #preview-panel { position: static; width: 100%; min-height: auto; }
  }
</style>
</head>
<body>

<div id="sections">
  <h1>Mini Stealth Configurator</h1>
  <p id="header">Select your printer and work your way down the page.</p>

  <!-- 01: Printer -->
  <div class="section" id="sec-printer">
    <h2>Printer</h2>
    <div class="options" id="opt-printer"></div>
  </div>

  <!-- 02: X-Carriage / Rail -->
  <div class="section hidden" id="sec-carriage">
    <h2>X-Carriage</h2>
    <div class="options" id="opt-carriage"></div>
    <p class="sub-label hidden" id="carriage-note"></p>
  </div>

  <!-- 04: Hotend -->
  <div class="section" id="sec-hotend">
    <h2>Hotend</h2>
    <div class="options" id="opt-hotend"></div>
  </div>

  <!-- 07: Probe -->
  <div class="section hidden" id="sec-probe">
    <h2>Probe</h2>
    <div class="options" id="opt-probe"></div>
  </div>

  <!-- 07b: Probe Bracket (sub-selection) -->
  <div class="section hidden" id="sec-probebracket">
    <h2>Probe Bracket</h2>
    <div class="options" id="opt-probebracket"></div>
  </div>

  <!-- 03: Extruder -->
  <div class="section" id="sec-extruder">
    <h2>Extruder</h2>
    <div class="options" id="opt-extruder"></div>
  </div>

  <!-- 08: Motor Bridge -->
  <div class="section hidden" id="sec-bridge">
    <h2>Motor Bridge</h2>
    <div class="options" id="opt-bridge"></div>
    <div class="options hidden" id="opt-chainholes" style="margin-top:.5rem"></div>
  </div>

  <!-- 05: Shroud -->
  <div class="section hidden" id="sec-shroud">
    <h2>Shroud</h2>
    <div class="options" id="opt-shroud"></div>
  </div>

  <!-- 06: Fan -->
  <div class="section hidden" id="sec-fan">
    <h2>Hotend Fan</h2>
    <div class="options" id="opt-fan"></div>
  </div>

  <!-- 09: LED -->
  <div class="section hidden" id="sec-led">
    <h2>Status LED</h2>
    <div class="options" id="opt-led"></div>
  </div>

  <!-- File List Output -->
  <div id="filelist" class="hidden"></div>
</div>

<!-- Preview Panel -->
<div id="preview-panel">
  <img id="preview-img" src="" alt="" style="display:none">
  <p id="preview-label">Hover over an option<br>to preview</p>
</div>

<script src="script.js"></script>
</body>
</html>
